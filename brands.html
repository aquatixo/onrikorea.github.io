<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnriKorea - Brand Candidates</title>
<link rel="stylesheet" href="style.css">
<style>
  #controls { margin-bottom: 14px; }
  #search {
    padding: 8px 10px;
    font-size: 0.95rem;
    width: 280px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  #count { margin-left: 10px; color: #555; font-size: 0.9rem; }
  table {
    border-collapse: collapse;
    width: 100%;
    background: white;
    font-size: 0.85rem;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 6px 8px;
    text-align: left;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  th { background: #f0f0f0; position: sticky; top: 0; }
  tr:hover { background: #fafafa; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand">OnriKorea</a>
  <a href="brands.html" class="active">Brands</a>
</nav>

<h1>Brand Candidates</h1>
<div id="status">Connecting...</div>
<div id="controls">
  <input type="text" id="search" placeholder="Filter by name, country, SKU...">
  <span id="count"></span>
</div>
<table id="brandsTable">
  <thead>
    <tr>
      <th>No</th>
      <th>Name</th>
      <th>Country</th>
      <th>SKU</th>
      <th>Year</th>
      <th>Website</th>
      <th>Contact point</th>
      <th>Cold Email</th>
      <th>Reply</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBq2-SplTY_C_yyJ9nDj5v5LFbMDbvrQk",
    authDomain: "onrikorea-65fa6.firebaseapp.com",
    projectId: "onrikorea-65fa6",
    storageBucket: "onrikorea-65fa6.firebasestorage.app",
    messagingSenderId: "224756002419",
    appId: "1:224756002419:web:65aa9cb035ce05f5100406"
  };

  const statusEl = document.getElementById("status");
  const tbody = document.getElementById("tbody");
  const searchEl = document.getElementById("search");
  const countEl = document.getElementById("count");

  let allRows = [];

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    loadBrands(db);
  } catch (err) {
    showError("Failed to initialize Firebase: " + err.message);
  }

  async function loadBrands(db) {
    try {
      const snapshot = await getDocs(collection(db, "brands"));
      if (snapshot.empty) {
        statusEl.textContent = "Connected, but 'brands' collection is empty.";
        statusEl.className = "ok";
        return;
      }
      allRows = [];
      snapshot.forEach(doc => allRows.push(doc.data()));
      allRows.sort((a, b) => (Number(a.no) || 0) - (Number(b.no) || 0));

      statusEl.textContent = `Connected. Loaded ${allRows.length} brand(s).`;
      statusEl.className = "ok";
      render(allRows);

      searchEl.addEventListener("input", () => {
        const q = searchEl.value.trim().toLowerCase();
        const filtered = q
          ? allRows.filter(r =>
              [r.name, r.country, r.sku].some(v => (v ?? "").toString().toLowerCase().includes(q))
            )
          : allRows;
        render(filtered);
      });
    } catch (err) {
      showError("Error reading 'brands' collection: " + err.message);
    }
  }

  function render(rows) {
    tbody.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (const r of rows) {
      const tr = document.createElement("tr");
      const website = r.website ?? "";
      const websiteCell = website.startsWith("http")
        ? `<a href="${website}" target="_blank" rel="noopener">${website}</a>`
        : website;
      tr.innerHTML = `
        <td>${r.no ?? ""}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.country)}</td>
        <td>${escapeHtml(r.sku)}</td>
        <td>${r.foundedYear ?? ""}</td>
        <td>${websiteCell}</td>
        <td>${escapeHtml(r.contactPoint)}</td>
        <td>${escapeHtml(r.coldEmail)}</td>
        <td>${escapeHtml(r.reply)}</td>
      `;
      frag.appendChild(tr);
    }
    tbody.appendChild(frag);
    countEl.textContent = `${rows.length} shown`;
  }

  function escapeHtml(v) {
    if (v === null || v === undefined) return "";
    const div = document.createElement("div");
    div.textContent = v;
    return div.innerHTML;
  }

  function showError(msg) {
    statusEl.textContent = msg;
    statusEl.className = "error";
    console.error(msg);
  }
</script>
</body>
</html>
